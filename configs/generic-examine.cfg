# Generic examination for distribution OpenOCD 0.12.
# Generic Cortex-M examination only; no vendor script or flash bank.
# Invoke only after physical power/wiring verification.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/swj-dp.tcl]
adapter speed 100
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
set CHIPNAME dx_lr32_generic
swj_newdap $CHIPNAME cpu -expected-id 0
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap
# No work area, RAM loader, flash bank, reset, halt, or write commands.
init
targets
shutdown
