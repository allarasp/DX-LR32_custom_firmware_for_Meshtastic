# Audited CX32L003F8-only programming setup. No operation occurs until init.
# Use tools/openocd-cx32/bin/openocd, not the Ubuntu distribution binary.
source [find interface/stlink.cfg]
transport select swd
set CHIPNAME dx_lr32
set FLASH_SIZE 0x10000
set WORKAREASIZE 0x1000
source [find target/cx32l003.cfg]
adapter speed 100
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
