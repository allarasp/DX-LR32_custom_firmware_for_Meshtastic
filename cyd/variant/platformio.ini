[env:cyd-dxlr32]
extends = esp32_base
board = esp32dev
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = CYD DX-LR32 UART experimental
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32/cyd-dxlr32
  -DCYD_DXLR32
  -DUSER_SETUP_LOADED
  -DHAS_WIRE=0
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  -DMESHTASTIC_EXCLUDE_MQTT=1
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
lib_deps =
  ${arduino_base.lib_deps}
  ${radiolib_base.lib_deps}
  h2zero/NimBLE-Arduino@1.4.3
  lewisxhe/XPowersLib@0.3.3
  rweather/Crypto@0.4.0
  lovyan03/LovyanGFX@1.2.21
upload_speed = 115200
